<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NESTARA</title>
    <link rel="stylesheet" href="auth.css">
</head>

<body class="auth-page">

    <!-- HEADER -->
    <header class="auth-header">
        <div class="header-logo">
            NES<span>TARA</span>
        </div>
    </header>

    <!-- CONTAINER LOGIN -->
    <main class="auth-container">
        <div class="login-box">

            <div class="form-logo">
                NES<span>TARA</span>
            </div>

            <h1>Login</h1>

            <form id="loginForm">
                <input
                  type="email"
                    id="loginEmail"
                    placeholder="Masukkan Email"
                    required
                >

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    required
                >

                <button type="submit">Log In</button>
            </form>

            <p class="account-text">
                belum punya akun? <a href="register.html">sign up</a>
            </p>

            <a href="index.html" class="home-link">Kembali ke beranda</a>

        </div>
    </main>

    <!-- SCRIPT LOGIN -->
    <script src="script.js"></script>
</body>
</html>
    </script>

</body>

</html>
